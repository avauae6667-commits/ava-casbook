<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b3d3a"/>
<title>AVA Cash Book — Accounting &amp; Excel Manager</title>
<meta name="description" content="Multi-account cash book with Excel import/export, VAT, P&L and bank reconciliation for AVA Passengers Transport, Dubai."/>
<style>
:root{
  --teal:#0b3d3a; --teal2:#0f4f4a; --teal3:#14655e; --gold:#d6b265; --gold2:#b8954a;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --ok:#047857; --okbg:#d1fae5; --warn:#b45309; --warnbg:#fef3c7; --bad:#be123c; --badbg:#ffe4e6;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
header.topbar{background:linear-gradient(135deg,var(--teal) 0%,var(--teal2) 60%,var(--teal3) 100%);color:#fff;padding:14px 0 0;box-shadow:var(--shadow)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{background:var(--gold);color:var(--teal);font-weight:800;border-radius:10px;padding:8px 10px;font-size:15px;letter-spacing:1px}
.brand h1{margin:0;font-size:18px}
.brand p{margin:0;font-size:12px;opacity:.85}
.spacer{flex:1}
.savestate{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.dot.pulse{animation:pulse .9s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
nav.nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;padding-bottom:0}
nav.nav button{background:transparent;border:0;color:#cfe3e0;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
nav.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav.nav button.on{background:var(--bg);color:var(--teal)}
main{padding:18px 0 40px}
footer{padding:14px 0 26px;color:var(--muted);font-size:12px}
.hero{background:linear-gradient(135deg,var(--teal2),var(--teal3));color:#fff;border-radius:var(--radius);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:20px}
.hero p{margin:2px 0 0;font-size:13px;opacity:.85}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14.5px}
.card-b{padding:14px 16px}
.grid{display:grid;gap:12px}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:21px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;background:#e2e8f0;color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn-primary{background:var(--teal2);color:#fff}
.btn-gold{background:var(--gold);color:#3d2f0f}
.btn-danger{background:var(--badbg);color:var(--bad)}
.btn-xs{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.neutral{background:#e2e8f0;color:#475569}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef2f7;vertical-align:top}
tr:hover td{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.strong{font-weight:700}
.rowin td{background:#f0fdf9}
.rowout td{background:#fff7f7}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfdfe}
.field{display:flex;flex-direction:column;gap:4px;min-width:130px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;background:#fff;font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid var(--teal3);outline-offset:0;border-color:transparent}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.section-lbl{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--teal2);text-transform:uppercase;letter-spacing:.5px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-h .x{border:0;background:#eef2f7;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
.modal-b{padding:16px 18px;max-height:65vh;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fbfdfe;border-radius:0 0 16px 16px}
.toast{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);transition:opacity .4s}
.toast div.ok{background:var(--ok)} .toast div.bad{background:var(--bad)}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.muted{color:var(--muted)} .tiny{font-size:11.5px}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.split{display:grid;gap:14px}
.split.split2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.split.split2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
.progressbar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--teal3)}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;background:#e2e8f0;color:#64748b}
.step.on{background:var(--teal2);color:#fff}
.step.done{background:var(--okbg);color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;background:#fbfdfe}
.drop.drag{border-color:var(--teal3);background:#eff8f6}
input[type=file]{display:none}
.badge-acc{display:inline-block;background:#eef6f5;color:var(--teal2);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
/* vouchers */
.vline{display:grid;grid-template-columns:1fr 64px 110px 90px 34px;gap:6px;align-items:center;margin-bottom:6px}
@media(max-width:640px){.vline{grid-template-columns:1fr 56px 90px 34px}.vl-amt{display:none}}
.vline input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;width:100%;font-family:inherit}
/* ---------- print (A4 voucher sheet) ---------- */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff}
  header.topbar,main,footer,#modalHost,.toast,#toastHost{display:none !important}
  #printArea{display:block !important}
  .pv-sheet{font-family:'Segoe UI',Arial,sans-serif;color:#000;font-size:12px}
  .pv-head{display:flex;align-items:center;gap:10px;border-bottom:3px solid #0b3d3a;padding-bottom:8px}
  .pv-mark{background:#0b3d3a;color:#d6b265;font-weight:800;border-radius:8px;padding:8px 10px;font-size:16px;letter-spacing:1px}
  .pv-co{font-size:15px;font-weight:800;color:#0b3d3a}
  .pv-title{text-align:center;font-size:16px;font-weight:800;letter-spacing:3px;margin:10px 0;color:#0b3d3a}
  .pv-meta{width:100%;border-collapse:collapse;margin-bottom:8px}
  .pv-meta td{border:0;padding:3px 6px;font-size:12px}
  .pv-items{width:100%;border-collapse:collapse}
  .pv-items th,.pv-items td{border:1px solid #333;padding:5px 7px;font-size:12px}
  .pv-items th{background:#e8f0ef;text-align:left}
  .pv-items .num,.pv-items tfoot td{text-align:right}
  .pv-items tfoot td{border:1px solid #333;font-weight:600}
  .pv-words{margin:10px 0;padding:7px 10px;border:1px dashed #666;border-radius:6px;font-size:12px}
  .pv-note{margin:6px 0;font-size:12px}
  .pv-sign{width:100%;border-collapse:collapse;margin-top:28mm}
  .pv-sign td{border:1px solid #333;height:22mm;vertical-align:bottom;padding:5px 8px;font-size:11px}
  .pv-foot{margin-top:8mm;text-align:center;color:#444}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="row1">
      <div class="brand">
        <div class="mark">AVA</div>
        <div><h1>AVA Cash Book</h1><p>Accounting &amp; Excel Manager · Dubai, UAE</p></div>
      </div>
      <div class="spacer"></div>
      <span class="savestate"><span class="dot" id="saveDot"></span><span id="saveTxt">Saved</span></span>
    </div>
    <nav class="nav" id="nav" aria-label="Tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap"><b>AVA PASSENGERS TRANSPORT</b> · Dubai, UAE · P.O. Box 91977<span id="footNote" class="tiny" style="display:block"></span></div></footer>
<div id="modalHost"></div>
<div id="printArea"></div>
<div class="toast" id="toastHost"></div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
/* ================= AVA CASH BOOK — CORE ENGINE (pure, DOM-free) ================= */
'use strict';
const KEY = 'ava-cashbook-xlsx-v1';
const APP_VERSION = 'AX1.0';

const DEFAULT_CATS = {
  'Diesel': ['ADNOC Wallet','Diesel - UAQ (Three Star)','Diesel - Sharjah (Three Star)','Diesel - Ajman (Al Bahar)'],
  'Income': ['ALICO Project Income','Data UAQ Income','Headline Income','Ajman Furniture Income','Exalogic Income'],
  'Rent': ['General Fleet Rent','UAQ Rent / DATS','Other Rent'],
  'Salaries': ['Driver Salary','Staff Salary','Salary Deposit'],
  'Permits': ['RAK Permit','Sharjah Permit','Dubai Permit','Parking Permit / Fees'],
  'Maintenance': ['New Tires','Used Tires','Batteries','Spare Parts','Workshop'],
  'Expenses': ['General Fleet Maintenance','Camry Expense','Office Expenses'],
  'AVA': ['AVA Office Rent','AVA Trade License','AVA Visas','AVA Telephone','AVA VAT','AVA Fines','AVA Salik'],
  'Vehicle hire (subcontract)': ['Bus hire','Pick-up hire','Salik recharge'],
  'Bank charges': ['Maintenance fee','Cheque book','Remittance charge','Teller charges'],
  'Cheque payments': ['To be assigned'],
  'Returned cheque': [],
  'Owner drawings': [],
  'Capital introduced': [],
  'Other': []
};

function freshData() {
  return {
    app: 'ava-cashbook', version: APP_VERSION,
    exported: new Date().toISOString(),
    settings: { cats: JSON.parse(JSON.stringify(DEFAULT_CATS)), co: { name: 'AVA PASSENGERS TRANSPORT', addr: 'P.O. Box 91977, Dubai, UAE | Phone: 00971 4 3439666 | Email: Contact@avarental.ae' } },
    accounts: [
      { id: 'acc-bank', name: 'Bank', kind: 'bank', opening: 0 },
      { id: 'acc-petty', name: 'Petty Cash', kind: 'cash', opening: 0 }
    ],
    tx: [], lockDate: '', updatedAt: 0
  };
}

/* ---------- money math (integer fils = 1/100 AED) ---------- */
const parseAmount = (v) => {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') { if (!isFinite(v)) return 0; return Math.round(v * 100); }
  const s = String(v).replace(/,/g, '').replace(/[^\d.()\-]/g, '');
  if (!s) return 0;
  const neg = /^\(.*\)$/.test(String(v).trim());
  const n = parseFloat(neg ? s.slice(1, -1) : s);
  return isNaN(n) ? 0 : Math.round(n * 100);
};
const fmt = (fils, cur = true) => {
  if (!isFinite(fils)) fils = 0;
  const neg = fils < 0, a = Math.abs(fils) / 100;
  const s = a.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + (cur ? 'AED ' : '') + s;
};
const fmt2 = (fils) => fmt(fils, false);
/* ---------- amount in words (UAE legal style) ---------- */
const ONES_W = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const TENS_W = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function chunkWords(n, label) {
  if (!n) return '';
  const h = Math.floor(n / 100), r = n % 100;
  let s = '';
  if (h) s += ONES_W[h] + ' Hundred' + (r ? ' and ' : '');
  if (r) { if (r < 20) s += ONES_W[r]; else { s += TENS_W[Math.floor(r / 10)]; if (r % 10) s += '-' + ONES_W[r % 10]; } }
  return s + (label ? ' ' + label : '');
}
function words(fils) {
  if (!fils) return 'Zero Dirhams Only';
  const neg = fils < 0, abs = Math.abs(Math.round(fils));
  const dh = Math.floor(abs / 100), fl = abs % 100;
  const bil = Math.floor(dh / 1e9), mil = Math.floor((dh % 1e9) / 1e6), th = Math.floor((dh % 1e6) / 1e3), rest = dh % 1e3;
  const parts = [];
  if (bil) parts.push(chunkWords(bil, 'Billion'));
  if (mil) parts.push(chunkWords(mil, 'Million'));
  if (th) parts.push(chunkWords(th, 'Thousand'));
  if (rest) parts.push(chunkWords(rest, ''));
  let out = (neg ? 'Minus ' : '') + (parts.join(' ') || 'Zero') + ' Dirham' + (dh === 1 ? '' : 's');
  if (fl) out += ' and ' + chunkWords(fl, '') + ' Fils';
  return out + ' Only';
}
const calcVat = (netFils, mode) => {
  if (mode === 'included') { const net = Math.round(netFils * 100 / 105); return { net, vat: netFils - net, total: netFils }; }
  if (mode === 'added') { const vat = Math.round(netFils * 5 / 100); return { net: netFils, vat, total: netFils + vat }; }
  return { net: netFils, vat: 0, total: netFils };
};

/* ---------- dates ---------- */
const pad2 = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const excelSerialToISO = (n) => {
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
};
const normalizeDate = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) {
    let y = v.getFullYear(), m = v.getMonth() + 1, d = v.getDate();
    if (y < 100) y += 2000;
    return (y >= 1990 && y <= 2100) ? y + '-' + pad2(m) + '-' + pad2(d) : '';
  }
  if (typeof v === 'number' && v > 20000 && v < 80000) return excelSerialToISO(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) { const y = +m[1], mo = +m[2], d = +m[3]; return (y >= 1990 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) ? y + '-' + pad2(mo) + '-' + pad2(d) : ''; }
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m) { let d = +m[1], mo = +m[2], y = +m[3]; if (y < 100) y += 2000; if (d > 12 && mo <= 12) { const t = d; d = mo; mo = t; } return (y >= 1990 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) ? y + '-' + pad2(mo) + '-' + pad2(d) : ''; }
  const p = new Date(s);
  if (!isNaN(p)) { const y = p.getFullYear(); if (y >= 1990 && y <= 2100) return y + '-' + pad2(p.getMonth() + 1) + '-' + pad2(p.getDate()); }
  return '';
};
const monthKey = (d) => (d || '').slice(0, 7);

/* ---------- balances ---------- */
function computeBalances(accounts, tx) {
  const out = {};
  accounts.forEach((a) => { out[a.id] = { opening: Number(a.opening) || 0, in: 0, out: 0, closing: Number(a.opening) || 0, count: 0 }; });
  tx.forEach((t) => {
    if (t.deleted) return;
    const b = out[t.acc]; if (!b) return;
    if (t.type === 'in') { b.in += t.amt; b.closing += t.amt; } else { b.out += t.amt; b.closing -= t.amt; }
    b.count++;
  });
  return out;
}
function runningBalance(tx, accId, opening) {
  const rows = tx.filter((t) => !t.deleted && t.acc === accId).sort((a, b) => a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : (a.date < b.date ? -1 : 1));
  let bal = parseAmount(opening);
  return rows.map((t) => { bal += (t.type === 'in' ? t.amt : -t.amt); return { t, bal }; });
}

/* ---------- Excel import ---------- */
const HEADER_ALIASES = {
  date: ['date','txn date','transaction date','voucher date','entry date','تاريخ'],
  account: ['account','account name','acc','cash/bank','book','cash book','account *'],
  description: ['description','details','narration','particulars','desc','item'],
  in: ['debit (money in)','debit','money in','in','receipt','deposit','income','amount in','dr','cash in','received'],
  out: ['credit (money out)','credit','out','payment','money out','withdrawal','expense','amount out','cr','cash out','paid'],
  amount: ['amount','amount (aed)','value','total','net amount','gross'],
  direction: ['type','direction','dr/cr','txn type','transaction type','d/c','in/out'],
  category: ['category','cat','head','account head','group'],
  sub: ['subcategory','sub category','sub','sub head','sub-category'],
  party: ['party','paid to','received from','payee','beneficiary','name','party name'],
  vehicle: ['vehicle','vehicle no','vehicle no.','plate','plate no','bus','bus no'],
  driver: ['driver','driver name','drv'],
  pm: ['payment method','method','mode','paid by','paid via','payment mode'],
  chq: ['cheque','cheque no','cheque number','chq','chq no','cheque #','cheque no.'],
  ref: ['reference','ref','reference no','ref no','voucher no','cheque ref','ref.'],
  vatMode: ['vat mode','vat treatment','vat?'],
  vatAmt: ['vat amount','vat (aed)','vat aed','vat'],
  notes: ['notes','note','remarks','comment']
};
function canonHeader(h) {
  const s = String(h == null ? '' : h).toLowerCase().replace(/\s+/g, ' ').replace(/[:*]/g, '').trim();
  return s;
}
function mapHeaders(headers) {
  const map = {}, used = new Set();
  // specific fields first so "VAT Amount" is not stolen by generic "amount"
  const order = ['date', 'account', 'description', 'in', 'out', 'vatMode', 'vatAmt', 'direction', 'amount', 'category', 'sub', 'party', 'vehicle', 'driver', 'pm', 'chq', 'ref', 'notes'];
  for (const field of order) {
    const aliases = HEADER_ALIASES[field];
    let idx = -1;
    for (const a of aliases) {
      const exact = headers.findIndex((h) => !used.has(String(h)) && canonHeader(h) === a);
      if (exact >= 0) { idx = exact; break; }
    }
    if (idx < 0) {
      for (const a of aliases) {
        const part = headers.findIndex((h) => !used.has(String(h)) && canonHeader(h).includes(a) && a.length > 2);
        if (part >= 0) { idx = part; break; }
      }
    }
    if (idx >= 0) { map[field] = idx; used.add(String(headers[idx])); }
  }
  return map;
}
function directionFrom(row, map, headers) {
  if (map.in != null || map.out != null) {
    const di = parseAmount(map.in != null ? row[map.in] : 0);
    const do_ = parseAmount(map.out != null ? row[map.out] : 0);
    if (di && do_) return { dir: 'both', amt: 0 };

function validateImportRows(rows, accounts, existingTx) {
  const errors = [], seen = new Set(), dups = [];

  rows.forEach((r) => {
    const errs = [];

    if (!r.account) errs.push('Missing account name');
    else if (!accNames.has(r.account.toLowerCase())) errs.push('Unknown account "' + r.account + '" (add it in Settings)');
    if (r.dir === 'none') errs.push('No amount (Debit / Credit both empty)');
    if (r.dir === 'both') errs.push('Both Debit and Credit filled on one row');
    if (r.dir === 'unknown') errs.push('Cannot read direction (use Debit = money in, Credit = money out)');

    if (seen.has(key)) { dups.push({ row: r._i, note: 'Duplicate row inside this file (first occurrence kept)' }); return; }
    if ((existingTx || []).some((t) => !t.deleted && t.date === r.date && String(t.accName || '').toLowerCase() === r.account.toLowerCase() && t.type === r.dir && t.amt === r.amt && (t.desc || '').toLowerCase() === (r.desc || '').toLowerCase())) { dups.push({ row: r._i, note: 'Already exists in the app (skipped)' }); return; }
    seen.add(key);

function accNameOf(data, id) { const a = (data.accounts || []).find((x) => x.id === id); return a ? a.name : id; }
function rowsToSheet(rows, cols) {
  const ws = {}; let range = { s: { r: 0, c: 0 }, e: { r: 0, c: 0 } };
  rows.forEach((row, ri) => {
    row.forEach((cell, ci) => {
      if (cell === null || cell === undefined || cell === '') return;
      const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
      if (typeof cell === 'object' && cell.f) ws[addr] = { t: 'n', f: cell.f };
      else if (typeof cell === 'number') ws[addr] = { t: 'n', v: cell };
      else ws[addr] = { t: 's', v: String(cell) };
    });
    if (row.length - 1 > range.e.c) range.e.c = row.length - 1;
    range.e.r = ri;
  });
  ws['!ref'] = XLSX.utils.encode_range(range);
  if (cols) ws['!cols'] = cols;
  return ws;
}

function toCsv(rows) { return rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n'); }
function plByCategory(tx, from, to) {
  const m = new Map();
  tx.forEach((t) => {
    if (t.deleted) return;
    if (from && t.date < from) return;
    if (to && t.date > to) return;
    if (t.tr) return;
    const c = t.cat || 'Uncategorised';
    if (!m.has(c)) m.set(c, { cat: c, in: 0, out: 0, vat: 0 });
    const e = m.get(c);
    if (t.type === 'in') e.in += t.amt; else e.out += t.amt;
    e.vat += t.vat || 0;
  });
  return [...m.values()].sort((a, b) => (b.in - b.out) - (a.in - a.out));
}
function vatSummary(tx, from, to) {
  let salesNet = 0, salesVat = 0, purchNet = 0, purchVat = 0, n = 0;
  tx.forEach((t) => {
    if (t.deleted || t.tr) return;
    if (from && t.date < from) return;
    if (to && t.date > to) return;
    n++;
    if (t.type === 'in') { salesNet += (t.amt - (t.vat || 0)); salesVat += (t.vat || 0); }
    else { purchNet += (t.amt - (t.vat || 0)); purchVat += (t.vat || 0); }
  });
  return { salesNet, salesVat, purchNet, purchVat, payable: salesVat - purchVat, count: n };
}

  else DATA.accounts.push({ id: 'acc-' + Date.now().toString(36), name, kind, opening });

}
function delAccount(id) {

/* ---------- file handling ---------- */
function readFile(file) {
  const rd = new FileReader();
  rd.onload = () => { try { ingestWorkbook(new Uint8Array(rd.result), file.name); } catch (e) { console.error(e); toast('Could not read that file: ' + e.message, 'bad'); } };
  rd.readAsArrayBuffer(file);
}
function ingestWorkbook(buf, fileName) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  // pick the sheet that actually contains transactions (template has several)
  let sheetName = wb.SheetNames[0], sheetRows = null;
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
    const m = rows.length ? mapHeaders(rows[0].map((h) => String(h == null ? '' : h))) : {};
    if (m.date != null && (m.in != null || m.out != null || (m.amount != null && m.direction != null))) { sheetName = sn; sheetRows = rows; break; }
  }
  if (!sheetRows) sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: null });
  const parsed = rowsFromSheet(sheetRows);
  parsed.fileName = fileName; parsed.sheetName = sheetName;
  // optional Accounts sheet from the template
  parsed.newAccounts = [];
  if (wb.Sheets['Accounts']) {
    const accRows = XLSX.utils.sheet_to_json(wb.Sheets['Accounts'], { header: 1, raw: true, defval: null });
    (accRows.slice(1) || []).forEach((r) => {
      if (!r || !r[0] || String(r[0]).trim() === '') return;
      const name = String(r[0]).trim();
      const exists = DATA.accounts.some((a) => a.name.toLowerCase() === name.toLowerCase());
      if (!exists) parsed.newAccounts.push({ name, kind: String(r[1] || '').toLowerCase() === 'bank' ? 'bank' : 'cash', opening: parseAmount(r[2]) });
    });
  }
  parsed.validation = validateImportRows(parsed.rows, DATA.accounts.concat(parsed.newAccounts.map((a) => ({ id: 'new', name: a.name }))), liveTx());
  S.importParsed = parsed; S.importStep = 2; render();
}
function commitImport() {
  const P = S.importParsed, V = P.validation;
  let stamp = Date.now();
  // create accounts found in the file's Accounts sheet first
  let createdAccs = 0;
  (P.newAccounts || []).forEach((a) => {
    const id = 'acc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 5);
    DATA.accounts.push({ id, name: a.name, kind: a.kind, opening: a.opening });
    createdAccs++;
  });
  const newTx = V.valid.map((r) => makeTxFromImport(r, DATA.accounts, stamp));
  // renumber createdAt sequentially to preserve file order
  newTx.forEach((t, i) => { t.createdAt = stamp + i; });
  pairTransfers(newTx);
  DATA.tx = newTx.concat(DATA.tx);
  const perAcc = new Map();
  newTx.forEach((t) => {
    if (!perAcc.has(t.acc)) perAcc.set(t.acc, { name: t.accName, n: 0, in: 0, out: 0 });
    const p = perAcc.get(t.acc); p.n++;
    if (t.type === 'in') p.in += t.amt; else p.out += t.amt;
  });
  S.importResult = { added: newTx.length, accts: perAcc.size, transfers: newTx.filter((t) => t.tr).length / 2, perAcc: [...perAcc.values()], createdAccs };
  save(); S.importStep = 3; S.importParsed = null; render();
  toast('Imported ' + newTx.length + ' entries.', 'ok');
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function downloadTemplate(blank) {
  const data = blank ? freshData() : DATA;
  const wb = buildWorkbook(data);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  download(blank ? 'AVA-CashBook-Template.xlsx' : 'ava-cashbook-' + today() + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  toast('Excel file downloaded.', 'ok');
}
function exportCsv() {
  const head = ['Date', 'Account', 'Direction', 'Description', 'Party', 'Category', 'Sub', 'Vehicle', 'Driver', 'VAT', 'Amount', 'Cheque', 'Reference', 'Method'];
  const rows = txSorted().map((t) => [t.date, t.accName || t.acc, t.type === 'in' ? 'IN' : 'OUT', t.desc, t.party || '', t.cat || '', t.sub || '', t.veh || '', t.drv || '', (t.vat / 100).toFixed(2), (t.amt / 100).toFixed(2), t.chq || '', t.ref || '', t.pm || '']);
  download('ava-cashbook-' + today() + '.csv', new Blob([toCsv([head, ...rows])], { type: 'text/csv;charset=utf-8' }));
  toast('CSV downloaded.', 'ok');
}
function exportPlCsv() {
  const pl = plByCategory(liveTx(), S.plFrom, S.plTo);

function exportVatCsv() {
  const y = new Date().getFullYear(), quarters = [[1, 3], [4, 6], [7, 9], [10, 12]], q = S.vatQ || 1;
  const from = y + '-' + pad2(quarters[q - 1][0]) + '-01', to = y + '-' + pad2(quarters[q - 1][1]) + '-30';
  const r = vatSummary(liveTx(), from, to);

  download('ava-vat-q' + q + '-' + y + '.csv', new Blob([toCsv(rows)], { type: 'text/csv;charset=utf-8' }));

/* ---------- IndexedDB for the Excel file handle ---------- */
function idb() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('ava-cashbook', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('handles');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(key) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('handles', 'readonly'); const rq = tx.objectStore('handles').get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbDel(key) { const db = await idb(); return new Promise((res) => { const tx = db.transaction('handles', 'readwrite'); tx.objectStore('handles').delete(key); tx.oncomplete = res; }); }
const supportsLocalLink = () => !!window.showOpenFilePicker;

/* ---------- Local Excel link (File System Access API — Chrome / Edge) ---------- */
let LOCAL_HANDLE = null;
async function linkLocalFile() {
  if (!supportsLocalLink()) { toast('Your browser does not support linking a file. Use Chrome or Edge, or use Settings → Excel export.', 'bad'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'AVA Cash Book workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }],
      multiple: false
    });
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      const p2 = await handle.requestPermission({ mode: 'readwrite' });
      if (p2 !== 'granted') { toast('Permission denied — the file was not linked.', 'bad'); return; }
    }
    LOCAL_HANDLE = handle;
    S.sync.localName = handle.name;
    await idbSet('localXlsx', handle);
    syncLog('Linked Excel file: ' + handle.name, 'ok');
    saveSyncCfg(); render();
    if (confirm('Linked "' + handle.name + '".\n\nWrite the current app data into this file now? (Choose Cancel if the file already holds your data and you want to keep it.)')) {
      await writeLocalNow();
    } else { toast('File linked. Use "Push to Excel" or "Pull from Excel" on the Sync tab.', 'ok'); }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.error(e); toast('Could not link file: ' + (e.message || e), 'bad');
  }
}
async function ensureLocalPermission() {
  if (!LOCAL_HANDLE) return false;
  let perm = await LOCAL_HANDLE.queryPermission({ mode: 'readwrite' });
  if (perm === 'prompt') perm = await LOCAL_HANDLE.requestPermission({ mode: 'readwrite' });
  return perm === 'granted';
}
async function writeLocalNow() {
  if (!LOCAL_HANDLE) { toast('No Excel file is linked yet.', 'bad'); return; }
  if (!(await ensureLocalPermission())) { toast('Permission needed — click "Re-connect file".', 'bad'); S.sync.localPerm = false; saveSyncCfg(); render(); return; }
  try {
    const wb = buildWorkbook(DATA);
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const writable = await LOCAL_HANDLE.createWritable();
    await writable.write(out);
    await writable.close();
    S.sync.lastLocal = new Date().toISOString();
    syncLog('Pushed app data → ' + LOCAL_HANDLE.name + ' (' + liveTx().length + ' entries)', 'ok');
    saveSyncCfg(); render(); toast('Saved to ' + LOCAL_HANDLE.name, 'ok');
  } catch (e) { console.error(e); syncLog('Excel write failed: ' + e.message, 'bad'); saveSyncCfg(); render(); toast('Write failed: ' + e.message, 'bad'); }
}
async function readLocalNow() {
  if (!LOCAL_HANDLE) { toast('No Excel file is linked yet.', 'bad'); return; }
  if (!(await ensureLocalPermission())) { toast('Permission needed — click "Re-connect file".', 'bad'); return; }
  try {
    const file = await LOCAL_HANDLE.getFile();
    const buf = await file.arrayBuffer();
    ingestWorkbook(new Uint8Array(buf), file.name);
    toast('File loaded — review the import preview.', 'ok');
  } catch (e) { console.error(e); toast('Read failed: ' + e.message, 'bad'); }
}
async function regrantLocal() {
  if (!LOCAL_HANDLE) { await linkLocalFile(); return; }
  const perm = await LOCAL_HANDLE.requestPermission({ mode: 'readwrite' });
  S.sync.localPerm = perm === 'granted';
  saveSyncCfg(); render();
  toast(perm === 'granted' ? 'File access re-granted.' : 'Permission still denied.', perm === 'granted' ? 'ok' : 'bad');
}
async function unlinkLocal() {
  if (!confirm('Unlink the Excel file? The app data stays untouched.')) return;
  await idbDel('localXlsx');
  LOCAL_HANDLE = null; S.sync.localName = ''; saveSyncCfg(); render(); toast('Excel file unlinked.', 'ok');
}
async function restoreLocalHandle() {
  try {
    const h = await idbGet('localXlsx');
    if (!h) return;
    LOCAL_HANDLE = h;
    S.sync.localName = h.name || '';
    S.sync.localPerm = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
    saveSyncCfg(); render();
  } catch (e) { console.warn('handle restore failed', e); }
}

/* ---------- Google Sheets / Drive bridge (Apps Script web app) ---------- */
async function bridgeCall(payload) {
  if (!S.sync.gUrl) { toast('Paste your Apps Script web-app URL first (Sync & Backup → Google).', 'bad'); return null; }
  try {
    const resp = await fetch(S.sync.gUrl, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const txt = await resp.text();
    let out;
    try { out = JSON.parse(txt); }
    catch (e) {
      if (/<html/i.test(txt)) throw new Error('The script URL returned a web page instead of data — re-deploy the web app (Deploy → New deployment → Web app) and copy the /exec URL.');
      throw new Error('Unexpected response: ' + txt.slice(0, 120));
    }
    if (!out.ok) throw new Error(out.error || 'Script reported an error');
    return out;
  } catch (e) {
    console.error(e);
    syncLog('Google: ' + e.message, 'bad'); saveSyncCfg(); render();
    toast('Google: ' + e.message, 'bad');
    return null;
  }
}
async function saveGoogleUrl() {
  const url = ($id('gUrl') || {}).value || '';
  if (!/https:\/\/script\.google\.com\/.+\/exec/.test(url.trim())) { toast('Paste the web-app URL ending in /exec.', 'bad'); return; }
  S.sync.gUrl = url.trim(); saveSyncCfg();
  const r = await bridgeCall({ action: 'ping' });
  if (r) { syncLog('Connected to Google Sheet "' + r.name + '"', 'ok'); saveSyncCfg(); toast('Connected: ' + r.name, 'ok'); }
  render();
}

  const r = await bridgeCall({ action: 'push', data: { accounts: DATA.accounts.map((a) => ({ name: a.name, kind: a.kind, opening: a.opening })), tx: liveTx() } });
  if (r) {
    S.sync.lastPush = new Date().toISOString();

    saveSyncCfg(); render(); toast('Pushed ' + r.rows + ' entries to Google Sheets.', 'ok');

/* ================= VOUCHERS — register, modal, words engine, A4 print ================= */
const PV_RE = /^PV-(\d{2})\/(\d{4})-(\d+)$/;

/* per-month sequence that never collides: scans ALL tx incl. deleted */
function nextVoucherNo(date) {
  const d = date || today();
  const mm = d.slice(5, 7), yy = d.slice(0, 4);
  let max = 0;
  (DATA.tx || []).forEach((t) => {
    if (!t.pv) return;
    const m = PV_RE.exec(t.pv);
    if (m && m[1] === mm && m[2] === yy) max = Math.max(max, parseInt(m[3], 10) || 0);
  });
  return 'PV-' + mm + '/' + yy + '-' + String(max + 1).padStart(2, '0');
}

/* line totals + UAE 5% VAT (pure — unit-tested in Node) */
function voucherTotals(lines, mode) {
  let gross = 0;
  (lines || []).forEach((l) => {
    const q = parseFloat(String(l.qty == null || l.qty === '' ? 1 : l.qty).replace(/[^\d.]/g, '')) || 1;
    gross += Math.round(parseAmount(l.rate) * q);
  });
  let net = gross, vat = 0;
  if (mode === 'included') { net = Math.round(gross * 100 / 105); vat = gross - net; }
  else if (mode === 'added') { vat = Math.round(gross * 5 / 100); gross = net + vat; }
  return { net, vat, total: gross };
}

/* one voucher = one tx in DATA.tx (type 'out') carrying pv / lines / partyTrn */
function buildVoucherTx(v) {
  const acc = (DATA.accounts || []).find((a) => a.id === v.acc) || DATA.accounts[0];
  const t = voucherTotals(v.lines, v.vatMode || 'none');
  const now = Date.now();
  return {
    uid: 'pv-' + now.toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    createdAt: now, deleted: false, tr: '',
    date: v.date || today(), acc: acc.id, accName: acc.name, type: 'out',
    amt: t.total, vat: t.vat, vatMode: v.vatMode || 'none',
    desc: (v.lines && v.lines[0] && v.lines[0].desc) || 'Payment voucher',
    party: v.payee || '', partyTrn: v.payeeTrn || '',
    cat: v.cat || 'Other', sub: v.sub || '', veh: v.veh || '', drv: v.drv || '',
    pm: v.pm || 'Cash', chq: v.chq || undefined, ref: v.pvNo || '', notes: v.notes || '',
    pv: v.pvNo, lines: v.lines || [], by: 'voucher'
  };
}

/* payee autocomplete index from past transactions */
function payeeIndex() {
  const map = new Map();
  liveTx().forEach((t) => {
    if (!t.party) return;
    if (!map.has(t.party)) map.set(t.party, { trn: '' });
    if (t.partyTrn && !map.get(t.party).trn) map.get(t.party).trn = t.partyTrn;
  });
  return map;
}

    '<div style="text-align:right" class="tiny muted">Voucher<br><b style="font-size:14px">' + esc(t.pv) + '</b></div></div>' +
    '<div class="pv-title">PAYMENT VOUCHER</div>' +
    '<table class="pv-meta"><tr><td style="width:22%"><b>Date:</b> ' + esc(t.date) + '</td><td style="width:28%"><b>Paid from:</b> ' + esc(t.accName || t.acc) + '</td><td><b>Payment method:</b> ' + esc(t.pm || '') + (t.chq ? ' · Cheque No ' + esc(t.chq) : '') + '</td></tr>' +
    '<tr><td colspan="2"><b>Paid to:</b> ' + esc(t.party || '—') + '</td><td><b>TRN:</b> ' + esc(t.partyTrn || '—') + '</td></tr>' +
    '<tr><td colspan="3"><b>Category:</b> ' + esc((t.cat || '') + (t.sub ? ' / ' + t.sub : '')) + (t.veh ? ' · <b>Vehicle:</b> ' + esc(t.veh) : '') + (t.drv ? ' · <b>Driver:</b> ' + esc(t.drv) : '') + '</td></tr></table>' +
    '<table class="pv-items"><thead><tr><th>#</th><th>Description</th><th class="num">Qty</th><th class="num">Rate (AED)</th><th class="num">Amount (AED)</th></tr></thead><tbody>' +
    rowsHtml + blanks +
    '</tbody><tfoot>' + tfoot + '</tfoot></table>' +
    '<div class="pv-words"><b>Amount in words:</b> ' + esc(words(t.amt)) + '</div>' +
    (t.notes ? '<div class="pv-note"><b>Notes:</b> ' + esc(t.notes) + '</div>' : '') +
    '<table class="pv-sign"><tr><td style="width:33%">Prepared By</td><td style="width:34%">Approved By</td><td style="width:33%">Received By (signature &amp; date)</td></tr></table>' +
    '<div class="pv-foot tiny">' + esc(co.name) + ' · ' + esc(co.addr || '') + ' — voucher ' + esc(t.pv) + ' generated by AVA Cash Book</div></div>';
}
function printVoucherTx(uid) {
  const t = DATA.tx.find((x) => x.uid === uid && x.pv);
  if (!t) return toast('Voucher not found.', 'bad');
  const host = document.getElementById('printArea');
  if (!host) return toast('Print area missing.', 'bad');
  host.innerHTML = voucherSheetHtml(t);
  window.print();
}

/* ---------- voucher CSV ---------- */
function exportVouchersCsv() {
  const head = ['Voucher No', 'Date', 'Account', 'Payee', 'Payee TRN', 'Category', 'Sub', 'Vehicle', 'Driver', 'Payment Method', 'Cheque No', 'VAT Mode', 'VAT (AED)', 'Total (AED)', 'Items'];
  const rows = DATA.tx.filter((t) => t.pv && !t.deleted).map((t) => [t.pv, t.date, t.accName || t.acc, t.party || '', t.partyTrn || '', t.cat || '', t.sub || '', t.veh || '', t.drv || '', t.pm || '', t.chq || '', t.vatMode || 'none', (t.vat / 100).toFixed(2), (t.amt / 100).toFixed(2), (t.lines || []).map((l) => l.desc + ' x' + (l.qty || 1) + ' @' + ((parseAmount(l.rate) || 0) / 100).toFixed(2)).join(' | ')]);
  download('ava-vouchers-' + today() + '.csv', new Blob([toCsv([head, ...rows])], { type: 'text/csv;charset=utf-8' }));
  toast('Voucher CSV downloaded.', 'ok');
}

/* ---------- wiring ---------- */
Object.assign(ACTIONS, {
  newVoucher: () => openVoucherModal(null),
  editVoucher: (el) => openVoucherModal(el.dataset.id),
  saveVoucher: (el) => saveVoucherFromModal(el.dataset.id || null),
  printVoucher: (el) => printVoucherTx(el.dataset.id),
  printPreviewVoucher: () => {
    const v = readVoucherForm(null);
    if (!v) return;
    const host = document.getElementById('printArea');
    if (!host) return;
    host.innerHTML = voucherSheetHtml(buildVoucherTx(v));
    window.print();
  },
  delVoucher: (el) => {
    const t = DATA.tx.find((x) => x.uid === el.dataset.id);
    if (!t) return;
    if (!confirm('Delete voucher ' + t.pv + ' (' + fmt(t.amt) + ')? The cash-book entry is removed and the voucher number is never reused.')) return;
    t.deleted = true; save(); render(); toast('Voucher ' + t.pv + ' deleted.', 'ok');
  },
  vAddLine: () => { const host = $id('vLines'); if (host) { host.insertAdjacentHTML('beforeend', vLineRow()); recalcVoucherTotals(); const rows = host.querySelectorAll('.vline .vl-desc'); if (rows.length) rows[rows.length - 1].focus(); } },
  vDelLine: (el) => { const row = el.closest('.vline'); if (row) { row.remove(); recalcVoucherTotals(); } },
  vClearFilters: () => { S.vFilter = { q: '', acc: '' }; render(); },
  exportVouchersCsv
});
document.addEventListener('input', (e) => {
  if (e.target.closest && e.target.closest('#vLines')) recalcVoucherTotals();
  if (e.target.id === 'vVat') recalcVoucherTotals();
  if (e.target.id === 'vfq') { S.vFilter = S.vFilter || { q: '', acc: '' }; S.vFilter.q = e.target.value; clearTimeout(window._vqT); window._vqT = setTimeout(() => { render(); const nq = $id('vfq'); if (nq) { nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); } }, 350); }
  if (e.target.id === 'vPayee') {
    const rec = payeeIndex().get(e.target.value.trim());
    const trn = $id('vTrn');
    if (rec && rec.trn && trn && !trn.value.trim()) trn.value = rec.trn;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'vVat') recalcVoucherTotals();
  if (e.target.id === 'vDate' && e.target.value) {
    const no = $id('pvNo');
    if (no && !DATA.tx.some((t) => t.pv === no.value && !t.deleted)) no.value = nextVoucherNo(e.target.value);
  }
  if (e.target.id === 'vfacc') { S.vFilter = S.vFilter || { q: '', acc: '' }; S.vFilter.acc = e.target.value; render(); }
});

</script>
</body>
</html>
